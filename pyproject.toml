[project]
name = "log-rca-agent"
version = "0.1.0"
description = "Tool-using root-cause analysis agent for log incidents, evaluated on labelled BGL"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
